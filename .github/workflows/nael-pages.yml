name: NAEL Static Dashboard - GitHub Pages
on:
  push:
    branches: [genspark_ai_developer]
    paths:
      - .github/workflows/nael-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nael-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe NAEL gateway
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify installable PWA assets
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
          python3 -m json.tool manifest.webmanifest >/dev/null
          grep -q 'serviceWorker.register' index.html
          grep -q 'nael-gateway-v20261122-2' sw.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
