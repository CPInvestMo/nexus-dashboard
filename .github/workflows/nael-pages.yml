name: Deploy NAEL public-safe PWA to GitHub Pages
on:
  push:
    branches: [nael-pwa-render-free]
    paths:
      - 'nael-pwa/**'
      - '.github/workflows/nael-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nael-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the prebuilt privacy-safe PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: nael-pwa
      - name: Wait for GitHub artifact indexing
        run: sleep 20
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
