<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10253c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="نائل">
  <meta name="description" content="نائل — مركز قيادة الأعمال والفرص والمتابعات، كتطبيق ويب آمن وقابل للتثبيت على iPhone.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/favicon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>نائل | NAEL Command Center</title>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" aria-label="القائمة الرئيسية">
      <div class="brand"><div class="brand-mark">N<span>•</span></div><div><strong>نائل <small>NAEL</small></strong><span>COMMAND CENTER</span></div></div>
      <div class="sidebar-label">غرفة القيادة</div>
      <nav id="desktopNav" class="desktop-nav">
        <button data-route="home" class="nav-link active"><svg><use href="#i-home"/></svg><span>الرئيسية</span></button>
        <button data-route="tasks" class="nav-link"><svg><use href="#i-check"/></svg><span>المهام والصفقات</span></button>
        <button data-route="outreach" class="nav-link"><svg><use href="#i-message"/></svg><span>المتابعات</span></button>
        <button data-route="channels" class="nav-link"><svg><use href="#i-grid"/></svg><span>القنوات والروابط</span></button>
        <button data-route="settings" class="nav-link"><svg><use href="#i-settings"/></svg><span>الإعدادات والربط</span></button>
      </nav>
      <div class="sidebar-foot"><div class="online-dot"></div><div>نسخة ويب خاصة<br><small>لا توجد رسائل تُرسل تلقائيًا</small></div></div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="top-title"><div class="eyebrow">CRYSTAL POWER INVESTMENTS</div><h1 id="routeTitle">صباح الخير، دي غرفة القيادة</h1><div class="top-sub" id="routeSubtitle">الفرص الأقرب للإيراد، في مكان واحد</div></div>
        <div class="head-actions"><button id="syncButton" class="round-button" title="تحديث من Google" aria-label="تحديث البيانات"><svg><use href="#i-refresh"/></svg></button><button id="headSettings" class="round-button" title="إعدادات الربط" aria-label="إعدادات الربط"><svg><use href="#i-settings"/></svg></button></div>
      </header>
      <main id="content" tabindex="-1" aria-live="polite"></main>
      <footer class="page-footer">NAEL · Independent from MatchPro infrastructure · Private data stays in your Google account or on this device.</footer>
    </div>
    <nav class="mobile-nav" aria-label="القائمة السفلية">
      <button data-route="home" class="bottom-link active"><svg><use href="#i-home"/></svg><span>الرئيسية</span></button>
      <button data-route="tasks" class="bottom-link"><svg><use href="#i-check"/></svg><span>المهام</span></button>
      <button data-route="outreach" class="bottom-link"><svg><use href="#i-message"/></svg><span>واتساب</span></button>
      <button data-route="channels" class="bottom-link"><svg><use href="#i-grid"/></svg><span>القنوات</span></button>
      <button data-route="settings" class="bottom-link"><svg><use href="#i-settings"/></svg><span>الإعدادات</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="taskDialog" class="dialog"><div id="dialogContent"></div><div class="dialog-close-wrap"><button id="closeDialog" class="btn btn-light">إغلاق</button></div></dialog>
  <input id="importFile" type="file" accept=".json,.csv,application/json,text/csv" multiple hidden>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 12 3 3 6-7"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M20 11.2A8.3 8.3 0 0 1 7.5 18.3L3 20l1.7-4.4A8.5 8.5 0 1 1 20 11.2Z"/><path d="M8 11h8M8 14h5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M19.5 13.5a8 8 0 0 0 0-3l2-1.5-2-3.5-2.3 1A8 8 0 0 0 14.5 5l-.5-2h-4l-.5 2a8 8 0 0 0-2.7 1.5l-2.3-1-2 3.5 2 1.5a8 8 0 0 0 0 3l-2 1.5 2 3.5 2.3-1a8 8 0 0 0 2.7 1.5l.5 2h4l.5-2a8 8 0 0 0 2.7-1.5l2.3 1 2-3.5-2-1.5Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-1.5 5M20 4v7h-7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m6 6-6-6 6-6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3 8 8 10 5-2 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 9-3 9-3 11h18c0-2-3-2-3-11M10 22h4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18M6 17v-6m6 6V4m6 13V9"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M5 17H4a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V3m-5 5 5-5 5 5M4 17v4h16v-4"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v14m-5-5 5 5 5-5M4 19v2h16v-2"/></symbol>
  </svg>
  <script src="./app.js" defer></script>
</body>
</html>
